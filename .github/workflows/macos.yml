name: macOS

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - name: Install dependencies
        run: |
          brew install sqlite
          bun install --frozen-lockfile
      - name: Check source and generated version
        run: |
          bun run check
          bun run version:check
      - name: Test TypeScript and E2E
        run: bun test
      - name: Test Swift
        run: bun run test:swift
      - name: Build Side.app
        run: bun run build
      - name: Smoke bundled app
        run: bun run smoke:bundle
      - name: Signing preflight
        run: sh apps/side-mac/scripts/sign-notarize.sh preflight apps/side-mac/.build/release/Side.app
      - name: Upload gate and bundle diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: side-macos-diagnostics
          path: |
            dist/gates/
            apps/side-mac/.build/release/Side.app/Contents/Resources/metadata/
          if-no-files-found: ignore
